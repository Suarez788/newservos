[passiveMobAggression]
	#Passive mob aggression mode: OFF, NEUTRAL (retaliate), HOSTILE (actively attack)
	#Allowed Values: OFF, NEUTRAL, HOSTILE
	mode = "OFF"
	#Base attack damage given to affected passive mobs
	# Default: 3.0
	# Range: 0.5 ~ 100.0
	baseDamage = 3.0
	#Add bonus damage based on the mob's max health
	scaleWithHealth = false
	#Scaling factor: totalDamage = baseDamage + (maxHealth * healthScaleFactor)
	# Default: 0.1
	# Range: 0.0 ~ 100.0
	healthScaleFactor = 0.1
	#Mob IDs affected (if non-empty, only these mobs are affected)
	whitelist = []
	#Mob IDs that are never affected
	blacklist = []

[zombieHandling]
	#Strip the vanilla leader zombie health bonus modifier from zombies entirely.
	disableLeaderZombies = false
	#Exclude the vanilla leader zombie health bonus from BuffMobs health scaling so leader zombies do not become overpowered. Ignored if disableLeaderZombies is true.
	excludeLeaderBonusFromMultiplier = true

[healthSync]
	#Synchronize a mob's current health with its new max health after BuffMobs modifies it, fixing structure mob health desync.
	enabled = true
	#OVERRIDE: fully heal the mob to its new max health.
	#STACK: preserve the mob's existing damage taken and add the health delta on top.
	#Allowed Values: OVERRIDE, STACK
	mode = "OVERRIDE"

[dimensionMaxHealth]
	#Enable fixed max health overrides per dimension
	enabled = false
	#If true, only mobs in 'allowlist' receive dimension max health overrides
	useAllowlist = false
	#Mob IDs eligible for dimension max health overrides (used when useAllowlist = true)
	allowlist = []
	#Mob IDs that never receive dimension max health overrides
	denylist = []

	[dimensionMaxHealth.slot1]
		#Dimension ID, e.g. minecraft:the_nether
		dimensionName = ""
		#Fixed max health applied to mobs in this dimension (0 = disabled)
		# Default: 0.0
		# Range: 0.0 ~ 999999.0
		maxHealth = 0.0

	[dimensionMaxHealth.slot2]
